<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GO SAFAR PRO v2.5</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#f6f8ff;--nav:#0a1931;--nav2:#132e65;--y:#facc15}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Tajawal',sans-serif;background:var(--bg);color:#0f172a;height:100vh;overflow:hidden}
.topbar{height:64px;background:linear-gradient(90deg,#081a36,#123a75 50%,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative}
.topbar::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 200px at 20% 50%,rgba(124,58,237,.35),transparent),radial-gradient(400px 200px at 80% 20%,rgba(14,165,233,.4),transparent)}
.topbar>*{position:relative;z-index:2}
.logo{display:flex;gap:10px;align-items:center;font-weight:900;font-size:22px}.logo i{width:38px;height:38px;background:linear-gradient(135deg,#facc15,#f59e0b);color:#0a1931;border-radius:12px;display:grid;place-items:center}
.clock-card{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:14px;backdrop-filter:blur(10px)}
.clock-card b{font-family:'Outfit';font-size:15px;display:block}.clock-card span{font-size:11px;font-family:'Outfit';opacity:.9}
.main-row{display:flex;flex:1;overflow:hidden;height:calc(100vh - 108px)}
.sidebar{width:260px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#cbd5e1;display:flex;flex-direction:column}
.side-scroll{flex:1;overflow-y:auto;padding:12px}
.nav-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer;margin-bottom:4px;font-weight:700;font-size:14px;transition:.2s}
.nav-item:hover{background:rgba(255,255,255,.08)}.nav-item.active{background:linear-gradient(135deg,#0ea5e9,#7c3aed);color:#fff}
.taskbar{height:44px;background:linear-gradient(90deg,#0a1931,#12306a);color:#e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px}
.taskbar a{color:#fff;text-decoration:none;display:flex;gap:7px;align-items:center;font-weight:700}
.content-area{flex:1;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(800px 400px at 10% -10%,rgba(14,165,233,.12),transparent),radial-gradient(600px 300px at 90% 10%,rgba(124,58,237,.12),transparent),var(--bg)}
.content-scroll{flex:1;overflow-y:auto;padding:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:18px;padding:14px;border:1px solid #e2e8f0}
.panel{background:#fff;border-radius:18px;border:1px solid #e2e8f0;margin-bottom:14px;overflow:hidden}
.panel-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:8px}
.table-wrap{overflow:auto;max-height:60vh}table{width:100%;border-collapse:collapse;min-width:700px}th{padding:10px 12px;text-align:start;font-size:11px;color:#64748b;background:#f8fafc;position:sticky;top:0}td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;font-weight:600}
.btn{padding:9px 14px;border:none;border-radius:11px;font-weight:800;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.btn-y{background:linear-gradient(135deg,#facc15,#f59e0b);color:#0a1931}.btn-b{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff}.btn-d{background:#0a1931;color:#fff}.btn-g{background:#f1f5f9}
.input{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:11px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,25,49,.55);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.modal.show{display:flex}
.box{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:680px;max-height:92vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid2{grid-template-columns:1fr}.sidebar{position:fixed;inset-inline-start:-270px;top:64px;bottom:44px;z-index:60;transition:.3s}.sidebar.open{inset-inline-start:0}}
.lang-btn{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.status{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:900}.s-paid{background:#dcfce7;color:#166534}.s-part{background:#fef9c3;color:#854d0e}.s-unpaid{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;height:100vh">
<div class="topbar"><div style="display:flex;gap:10px;align-items:center"><button class="lang-btn" onclick="document.getElementById('sb').classList.toggle('open')"><i class="fa fa-bars"></i></button><div class="logo"><i class="fa-solid fa-plane-departure"></i> GO-<b style="color:#facc15">SAFAR</b></div></div><div style="display:flex;gap:8px;align-items:center"><div class="clock-card"><div style="width:34px;height:34px;background:#fff;color:#0a1931;border-radius:9px;display:grid;place-items:center"><i class="fa-regular fa-clock"></i></div><div><b id="ct">--:--</b><span id="cd">Loading</span></div></div><button class="lang-btn" onclick="toggleLang()"><i class="fa-solid fa-globe"></i></button></div></div>
<div class="main-row"><aside class="sidebar" id="sb"><div class="side-scroll" id="nav"></div></aside><div class="content-area"><div class="content-scroll" id="content"></div></div></div>
<footer class="taskbar"><a href="tel:01002454992"><i class="fa-solid fa-phone"></i> 01002454992</a><a href="mailto:gosafar98@gmail.com" style="background:rgba(255,255,255,.1);padding:5px 12px;border-radius:999px"><i class="fa-regular fa-envelope"></i> gosafar98@gmail.com</a><a><i class="fa-solid fa-location-dot"></i> الفيوم - مركز طامية</a></footer>
</div>
<div class="modal" id="mS"><div class="box"><h3 style="font-weight:900">✈️ خدمة جديدة</h3><div class="grid2" style="margin-top:10px"><div><label>التاريخ</label><input type="date" id="f_d" class="input"></div><div><label>اسم العميل *</label><input id="f_c" class="input"></div><div><label>هاتف العميل</label><input id="f_cp" class="input"></div><div><label>المندوب</label><input id="f_m" class="input"></div><div><label>الخدمة</label><select id="f_st" class="input"><option>زيارة سياحية</option><option>زيارة عائلية</option><option>زيارة أعمال</option><option>حجز طيران</option><option>تأشيرة - تساهيل</option><option>إقامة فندقية</option><option>خدمة مخصصة</option></select></div><div><label>المبلغ</label><input type="number" id="f_a" class="input"></div><div><label>المدفوع</label><input type="number" id="f_p" class="input" value="0"></div><div><label>التكلفة</label><input type="number" id="f_co" class="input" value="0"></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn btn-g" onclick="hide('mS')">إلغاء</button><button class="btn btn-y" onclick="saveS()">حفظ ✅</button></div></div></div>
<div class="modal" id="mT"><div class="box" style="max-width:460px"><h3>حركة مالية</h3><div style="display:grid;gap:10px;margin-top:10px"><select id="t_t" class="input"><option value="collection">تحصيل داخل</option><option value="payment">سداد خارج</option><option value="deferred">آجل</option></select><input id="t_p" class="input" placeholder="الاسم"><input type="number" id="t_a" class="input" placeholder="المبلغ"><input id="t_n" class="input" placeholder="البيان"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn btn-g" onclick="hide('mT')">إلغاء</button><button class="btn btn-b" onclick="saveT()">حفظ</button></div></div></div>
<div class="modal" id="mP"><div class="box" style="max-width:800px"><div id="pA"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn btn-g" onclick="hide('mP')">إغلاق</button><button class="btn btn-d" onclick="window.print()"><i class="fa fa-print"></i> طباعة</button></div></div></div>
<script>
let LANG=localStorage.getItem('go_lang')||'ar';
let KEY='go_final_v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{services:[],transfers:[],expenses:[],deferred:[]};
let cur='dash',fTxt='';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function hide(id){document.getElementById(id).classList.remove('show')}function show(id){document.getElementById(id).classList.add('show')}
function toggleLang(){LANG=LANG==='ar'?'en':'ar';localStorage.setItem('go_lang',LANG);applyLang();render()}
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';}
function rem(s){return Math.max(0,(s.amount||0)-(s.paid||0))}
function bal(){let ci=db.transfers.filter(t=>t.type==='collection').reduce((a,t)=>a+t.amount,0)+db.services.reduce((a,s)=>a+(s.paid||0),0);let co=db.transfers.filter(t=>t.type==='payment').reduce((a,t)=>a+t.amount,0)+db.expenses.reduce((a,e)=>a+e.amount,0);return ci-co}
function gClients(){let m={};db.services.forEach(s=>{if(!m[s.client])m[s.client]={name:s.client,phone:s.cphone||'',total:0,paid:0,services:[]};m[s.client].total+=s.amount;m[s.client].paid+=s.paid||0;m[s.client].services.push(s)});return m}
function tick(){let n=new Date();document.getElementById('ct').textContent=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('cd').textContent=n.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}setInterval(tick,1000);tick();
function nav(k){cur=k;document.getElementById('sb').classList.remove('open');render()}
function buildNav(){
 let c={services:db.services.length,clients:Object.keys(gClients()).length,deferred:db.deferred.length+db.transfers.filter(t=>t.type==='deferred').length};
 let it=[['dash',LANG==='ar'?'الرئيسية':'Dashboard','fa-house'],['services',LANG==='ar'?'الخدمات':'Services','fa-plane',c.services],['clients',LANG==='ar'?'العملاء':'Clients','fa-users',c.clients],['transfers',LANG==='ar'?'التحويلات':'Transfers','fa-right-left'],['deferred',LANG==='ar'?'حسابات آجلة':'Deferred','fa-hourglass-half',c.deferred],['expenses',LANG==='ar'?'المصروفات':'Expenses','fa-wallet'],['reports',LANG==='ar'?'التقارير':'Reports','fa-chart-line'],['settings',LANG==='ar'?'الإعدادات':'Settings','fa-gear']];
 document.getElementById('nav').innerHTML=it.map(([k,l,i,b])=>`<div class="nav-item ${cur===k?'active':''}" onclick="nav('${k}')"><i class="fa-solid ${i}"></i><span>${l}</span>${b?`<span style="margin-inline-start:auto;background:#facc15;color:#0a1931;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:900">${b}</span>`:''}</div>`).join('')+`<div style="margin-top:14px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px;font-size:12px"><div style="display:flex;justify-content:space-between"><span>الخزنة</span><b style="color:#facc15">${bal().toLocaleString()} EGP</b></div></div>`;
}
function render(){buildNav();if(cur==='dash')rDash();else if(cur==='services')rS();else if(cur==='clients')rC();else if(cur==='transfers')rT();else if(cur==='deferred')rD();else if(cur==='expenses')rE();else if(cur==='reports')rR();else if(cur==='settings')rSet()}
function rDash(){let sales=db.services.reduce((a,s)=>a+s.amount,0);document.getElementById('content').innerHTML=`<div style="background:linear-gradient(135deg,#081a36,#123a75 40%,#0ea5e9);color:#fff;border-radius:22px;padding:18px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h2 style="font-size:24px;font-weight:900">GO <span style="color:#facc15">SAFAR</span> ✈️</h2><p style="opacity:.85;font-size:13px">نظام إدارة السفريات - الفيوم طامية</p></div><div style="display:flex;gap:8px"><button class="btn btn-y" onclick="openS()"><i class="fa fa-plus"></i> خدمة</button><button class="btn" style="background:#fff;color:#0a1931" onclick="nav('reports')"><i class="fa fa-chart-simple"></i> تقارير</button></div></div></div><div class="kpi-grid" style="margin-top:12px"><div class="kpi"><small>💰 المبيعات</small><b>${sales.toLocaleString()} EGP</b></div><div class="kpi"><small>👥 العملاء</small><b>${Object.keys(gClients()).length}</b></div><div class="kpi"><small>⏳ متبقي</small><b>${db.services.reduce((a,s)=>a+rem(s),0).toLocaleString()}</b></div><div class="kpi"><small>🏦 الخزنة</small><b style="color:${bal()>=0?'#059669':'#dc2626'}">${bal().toLocaleString()}</b></div></div><div class="panel"><div class="panel-head"><h3>آخر الخدمات</h3><button class="btn btn-g" onclick="nav('services')">الكل</button></div><div class="table-wrap"><table><thead><tr><th>العميل</th><th>الخدمة</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${db.services.slice(-6).reverse().map(s=>`<tr><td><b>${s.client}</b><div style="font-size:11px;color:#64748b">${s.date}</div></td><td>${s.stype}</td><td>${s.amount.toLocaleString()}</td><td><span class="status ${rem(s)===0?'s-paid':rem(s)<s.amount?'s-part':'s-unpaid'}">${rem(s)===0?'مدفوع':rem(s)<s.amount?'جزئي':'غير مدفوع'}</span></td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center;padding:20px">لا يوجد</td></tr>'}</tbody></table></div></div>`;}
function rS(){document.getElementById('content').innerHTML=`<div class="panel"><div class="panel-head"><h3>✈️ الخدمات ${db.services.length}</h3><div style="display:flex;gap:6px"><input class="input" placeholder="بحث..." style="width:180px" oninput="fTxt=this.value;rS()"><button class="btn btn-y" onclick="openS()"><i class="fa fa-plus"></i> خدمة</button></div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>التاريخ</th><th>العميل</th><th>الخدمة</th><th>المستحق</th><th>المدفوع</th><th>المتبقي</th><th>ربح</th><th></th></tr></thead><tbody>${db.services.filter(s=>!fTxt||JSON.stringify(s).includes(fTxt)).slice().reverse().map((s,i)=>`<tr><td>${i+1}</td><td>${s.date}</td><td><b>${s.client}</b></td><td>${s.stype}</td><td>${s.amount.toLocaleString()}</td><td style="color:#059669">${(s.paid||0).toLocaleString()}</td><td style="color:${rem(s)>0?'#dc2626':'#059669'};font-weight:900">${rem(s).toLocaleString()}</td><td style="color:#7c3aed">${(s.amount-(s.cost||0)).toLocaleString()}</td><td><button class="btn btn-g" style="padding:5px" onclick="printClient('${s.client}')"><i class="fa fa-print"></i></button></td></tr>`).join('')||'<tr><td colspan=9 style="text-align:center">لا يوجد</td></tr>'}</tbody></table></div></div>`}
function openS(){document.getElementById('f_d').value=new Date().toISOString().slice(0,10);show('mS')}
function saveS(){let s={id:Date.now().toString(),date:document.getElementById('f_d').value,client:document.getElementById('f_c').value.trim(),cphone:document.getElementById('f_cp').value,mandob:document.getElementById('f_m').value,stype:document.getElementById('f_st').value,amount:parseFloat(document.getElementById('f_a').value||0),paid:parseFloat(document.getElementById('f_p').value||0),cost:parseFloat(document.getElementById('f_co').value||0)};if(!s.client||!s.amount)return alert('أكمل البيانات');db.services.push(s);if(s.paid>0)db.transfers.push({id:Date.now().toString(),type:'collection',date:s.date,person:s.client,amount:s.paid,note:'دفعة '+s.stype});save();hide('mS');render();}
function rC(){let m=gClients();let rows=Object.values(m);document.getElementById('content').innerHTML=`<div class="panel"><div class="panel-head"><h3>👥 العملاء • ${rows.length}</h3>
