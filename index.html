<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GO SAFAR</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
</head>
<body style="margin:0;background:#061a35;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Tajawal;flex-direction:column">
<div style="width:48px;height:48px;border:5px solid #1478ee;border-top-color:#ffd24a;border-radius:50%;animation:s 1s linear infinite"></div>
<p style="margin-top:12px">جاري تحميل GO SAFAR...</p>
<style>@keyframes s{to{transform:rotate(360deg)}}</style>
<script>
(async()=>{
  const u="https://raw.githubusercontent.com/Abdo2733/go-safar/main/app.html?t="+Date.now();
  try{
    let r=await fetch(u); let h=await r.text();
    if(h.includes("GO")){document.open();document.write(h);document.close();return;}
  }catch(e){}
  document.body.innerHTML='<div style="text-align:center;padding:20px"><h2>ارفع ملف app.html أولاً</h2><p>قولّي تم و أنا هارفعهولك</p></div>';
})();
</script>
</body>
</html>
