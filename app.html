<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO SAFAR PRO - Auto</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>:root{--primary:#1687D9;--sidebar:#10243A;--bg:#F3F7FC;--footer:#10243A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Cairo,sans-serif;height:100vh;overflow:hidden}.shell{display:flex;height:100vh}.side{width:270px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;order:2}.main{flex:1;display:flex;flex-direction:column;order:1;background:var(--bg)}.top{height:60px;background:linear-gradient(90deg,#10243A,#125CA1 60%,#1687D9);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 16px}.foot{height:38px;background:var(--footer);color:#cbd5e1;display:flex;justify-content:space-between;padding:0 14px;align-items:center;font-size:12px}.empty{flex:1}</style></head><body><div class="shell"><aside class="side"><div style="height:60px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:900">GO SAFAR - Auto ON</div><div style="flex:1;padding:12px;opacity:.7">سيتم تحميل القائمة تلقائياً...</div></aside><div class="main"><div class="top"><b>TASAHIL / GO SAFAR - جاري التحديث الأوتوماتيك...</b><span id="c"></span></div><div class="empty" id="root"></div><div class="foot"><span>01002454992</span><span>gosafar98@gmail.com</span></div></div></div><script>
// هذا اللودر سيجلب آخر نسخة من البرنامج تلقائياً
const REMOTE_VERSION_URL = 'https://abdo2733.github.io/go-safar/app.json?v='+Date.now();
async function loadApp(){
  try{
    document.getElementById('root').innerHTML='<div style="padding:20px">جاري تحميل التحديثات...</div>';
    // هنا سيتم حقن الكود الجديد تلقائيا بعد الربط
    let res = await fetch(REMOTE_VERSION_URL).catch(()=>null);
    if(res && res.ok){
      let data = await res.json();
      document.getElementById('root').innerHTML = data.html || 'تم التحديث';
    } else {
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#64748B">الهيكل الفارغ جاهز - الشريط الجانبي كامل الطول والصفحة فاضية<br><br>البرنامج الآن مربوط أوتوماتيك - أي تحديث أعمله سيظهر هنا</div>';
    }
  }catch(e){console.log(e)}
}
loadApp();
setInterval(()=>{document.getElementById('c').textContent=new Date().toLocaleTimeString()},1000);
</script></body></html>
