  --radius:16px;--shadow:0 4px 16px rgba(16,36,58,.08)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Cairo,Tajawal,sans-serif;background:var(--app-bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:60px;background:linear-gradient(90deg,#10243A,#125CA1 60%,#1687D9);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0}
.side-scroll{flex:1;overflow-y:auto;padding:10px}
.nav-item{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:3px;font-weight:700;font-size:13px}
.nav-item.active{background:var(--active)}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.content-scroll{flex:1;overflow-y:auto;padding:16px}
.footer{height:38px;background:var(--footer);color:#cbd5e1;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.btn{padding:8px 14px;border-radius:8px;border:none;font-weight:800;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn-primary{background:var(--primary);color:#fff}.btn-ghost{background:#EEF3F9}
.input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px}
.modal{position:fixed;inset:0;background:rgba(16,36,58,.55);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}.box{background:#fff;border-radius:16px;padding:16px;max-width:760px;width:96%;max-height:92vh;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:800px}th{padding:10px;background:#F8FBFD;font-size:11px;color:var(--muted);text-align:start;position:sticky;top:0}td{padding:10px;border-bottom:1px solid var(--border);font-size:13px}
</style>
</head>
